<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidadão Seguro - Painel de Controle</title>
    <link rel="icon" type="image/png" href="/img/logo.png">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body data-page="dashboard">
    <div class="dashboard-container">

        <aside class="sidebar no-print" id="sidebar">
            <div class="sidebar-header">
                <h2><img src="/img/logo.png" alt="Logo" class="sidebar-logo"> <span class="sidebar-text">Cidadão Seguro</span></h2>
                <button id="sidebar-toggle" class="btn-icon sidebar-toggle-btn"><i class="fa-solid fa-bars"></i></button>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item active"><i class="fa-solid fa-chart-pie" style="color: #3b82f6;"></i> <span class="sidebar-text">Início</span></a>
                <a href="/cidadaos" class="nav-item "><i class="fa-solid fa-users" style="color: #10b981;"></i> <span class="sidebar-text">Cidadãos</span></a>
                <a href="/agentes" class="nav-item "><i class="fa-solid fa-user-shield" style="color: #8b5cf6;"></i> <span class="sidebar-text">Agentes</span></a>
                <a href="/bairros" class="nav-item "><i class="fa-solid fa-map-location-dot" style="color: #f59e0b;"></i> <span class="sidebar-text">Bairros</span></a>
                <a href="/ocorrencias" class="nav-item "><i class="fa-solid fa-triangle-exclamation" style="color: #ef4444;"></i> <span class="sidebar-text">Ocorrências</span></a>
            </nav>
        </aside>

        <main class="main-content">

            <header class="topbar no-print">
                <div class="topbar-title">
                    <button id="mobile-toggle" class="btn-icon mobile-only"><i class="fa-solid fa-bars"></i></button>
                    <h1 id="page-title">Painel de Controle</h1>
                </div>
                <div class="topbar-actions">
                    <button id="theme-toggle" class="btn-icon">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <div id="page-spinner" class="page-spinner">
                <div class="spinner-circle"></div>
            </div>
            <div class="content-wrapper">

                <section class="content-section active">
                    <div class="dashboard-cards">
                        <div class="card stat-card">
                            <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                            <div class="stat-info">
                                <h3>Cidadãos</h3>
                                <p id="count-cidadaos">0</p>
                            </div>
                        </div>
                        <div class="card stat-card">
                            <div class="stat-icon"><i class="fa-solid fa-user-shield"></i></div>
                            <div class="stat-info">
                                <h3>Agentes</h3>
                                <p id="count-agentes">0</p>
                            </div>
                        </div>
                        <div class="card stat-card">
                            <div class="stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                            <div class="stat-info">
                                <h3>Ocorrências</h3>
                                <p id="count-ocorrencias">0</p>
                            </div>
                        </div>
                    </div>
                </section>
        
            </div>
            <footer class="admin-footer no-print">
                <p>&copy; 2026 Cidadão Seguro. Todos os direitos reservados.</p>
            </footer>
        </main>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
